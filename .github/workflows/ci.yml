name: Playable prototype CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.github/workflows/bootstrap-toolchain.yml', '.github/workflows/pages.yml', 'site/**', 'scripts/pages-package.mjs', 'tests/pages-package.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chrono-prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Retain exact source for reproducible handoff
        run: |
          mkdir -p test-results
          git archive --format=tar.gz -o "test-results/source-${GITHUB_SHA}.tar.gz" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test host input release and rescue approach contracts
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Test original file and HTTP browser journeys
        run: python tests/browser_smoke.py
      - name: Test fair exploration, co-op battle and versioned saves
        run: python tests/fair_browser.py
      - name: Test pendant story, lone canyon battle and v3 save reload
        run: python tests/opening_browser.py
      - name: Test Truce, Guardia, queen disappearance, Lucca co-op and v4 saves
        run: python tests/kingdom_browser.py
      - name: Test explicit targets and reference-art animation in real gameplay
        run: python tests/reference_browser.py
      - name: Test real companion route and P2 ownership after rejoining
        run: python tests/navigation_browser.py
      - name: Test cathedral rescue, third ally, Yakra and return-to-present v5 saves
        run: python tests/rescue_browser.py
      - name: Test trial, both prison routes, Dragon Tank, inventory and v7 future arrival
        run: python tests/trial_browser.py
      - name: Test software WebGL and unavailable-context recovery
        run: python tests/render_compatibility_browser.py
      - name: Verify same-source rendering compatibility observations
        if: always()
        run: node scripts/render-evidence.mjs
      - name: Test playable CPU fallback without WebGL
        run: python tests/cpu_renderer_browser.py
      - name: Verify same-source CPU pixels and native gameplay
        if: always()
        run: node scripts/cpu-evidence.mjs
      - name: Verify same-source CPU sampling and native 600 AD continuation
        if: always()
        run: node scripts/cpu-era-evidence.mjs
      - name: Test the existing rescue journey on native CPU fallback
        run: CHRONO_CPU_CHAIN=1 python tests/rescue_browser.py
      - name: Test the existing trial and both prison routes on native CPU fallback
        run: CHRONO_CPU_CHAIN=1 python tests/trial_browser.py
      - name: Verify source-bound CPU rescue, trial and sustained observations
        if: always()
        run: node scripts/cpu-adventure-evidence.mjs
      - name: Verify complete same-source validation evidence
        if: always()
        run: node scripts/ci-evidence.mjs validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrono-hd2d-browser-evidence
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chrono-hd2d-playable
          path: |
            dist/index.html
            dist/build-meta.json
            dist/QUALITY_STATUS.json
            dist/THIRD_PARTY_LICENSE.txt
            dist/THIRD_PARTY_NOTICES.md
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrono-hd2d-art-review-kit
          path: |
            dist/art/
            dist/QUALITY_STATUS.json
          if-no-files-found: warn
          retention-days: 30
  # Balance CI33's 45-minute serial budget without relaxing any journey.
  # Both independent export chains remain runner-local; no cross-run saves.
  fair-witness-journey:
    name: Fresh story and hearing (${{ matrix.route }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        route: [good, bad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Walk a fresh game through recorded fair conduct, rescue, trial and cell
        env:
          WITNESS_ROUTE: ${{ matrix.route }}
        run: python tests/witness_browser.py
      - name: Test real keyboard-only navigation, recovery and live actor presentation
        if: matrix.route == 'bad'
        run: python tests/keyboard_browser.py
      - name: Test fresh home, overworld, first meeting and v6 saves
        if: matrix.route == 'good'
        run: python tests/prologue_browser.py
      - name: Test actual merchant, equipment, economy, v8 reload and equipped combat
        if: matrix.route == 'good'
        run: python tests/equipment_browser.py
      - name: Verify complete same-source witness-lane evidence
        if: always()
        run: node scripts/ci-evidence.mjs ${{ matrix.route }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrono-witness-${{ matrix.route }}-evidence
          path: |
            test-results/
            dist/build-meta.json
          retention-days: 14
          if-no-files-found: error
